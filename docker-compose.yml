services:
  app:
    build: .
    container_name: terminalgolang
    ports:
      - "${APP_HOST_PORT:-8081}:8080"
    environment:
      PORT: "8080"
      APP_ENV: "production"
      DATA_PATH: "internal/curriculo/data/resume.json"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16-alpine
    container_name: postgres_database
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: curriculo
    ports:
      - "5433:5432"
    restart: unless-stopped
    volumes:
      - database_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d curriculo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  database_postgres:
